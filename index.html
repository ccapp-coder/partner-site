<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Partner | Courtright Collective</title>
  <meta name="description" content="Partner program from Courtright Collective. Something new is coming soon.">
  <meta name="keywords" content="Courtright Collective, partner program, Nashville indie app studio">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="canonical" href="https://partner.courtrightco.com">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Courtright Collective">
  <meta property="og:title" content="Partner | Courtright Collective">
  <meta property="og:description" content="Partner program from Courtright Collective. Something new is coming soon.">
  <meta property="og:url" content="https://partner.courtrightco.com">

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #0a0a0a;
      color: #f5f5f5;
      line-height: 1.6;
    }
    .wrap { text-align: center; padding: 2rem; max-width: 600px; }
    h1 { font-size: 3rem; margin: 0 0 1rem; font-weight: 700; letter-spacing: -0.02em; }
    p { font-size: 1.15rem; opacity: 0.85; margin: 0.5rem 0; }
    .home-link { display: inline-block; margin-top: 2rem; opacity: 0.7; }
    a { color: #f5f5f5; text-decoration: underline; text-underline-offset: 4px; }
    a:hover { opacity: 1; }
  
    /* ── PARTNER MOTION ── */
    body { position: relative; overflow: hidden; }
    body::before {
      content:''; position:absolute; inset:0; pointer-events:none;
      background:radial-gradient(ellipse 60% 50% at 50% 42%, rgba(196,92,40,0.16), transparent 70%);
      animation:pGlow 7s ease-in-out infinite;
    }
    @keyframes pGlow { 0%,100%{opacity:.55;transform:scale(1)} 50%{opacity:1;transform:scale(1.08)} }
    .wrap { position:relative; z-index:1; }
    .wrap > * { opacity:0; transform:translateY(16px); animation:pFade .7s ease-out forwards; }
    .wrap h1 { animation-delay:.1s; }
    .wrap p:nth-of-type(1){ animation-delay:.28s; }
    .wrap p:nth-of-type(2){ animation-delay:.42s; }
    .wrap .home-link{ animation-delay:.58s; }
    @keyframes pFade { to { opacity:1; transform:none; } }
    .wrap h1 {
      background:linear-gradient(100deg,#f5f5f5 0%,#C45C28 50%,#f5f5f5 100%);
      background-size:200% auto; -webkit-background-clip:text; background-clip:text;
      -webkit-text-fill-color:transparent; color:transparent;
      animation:pFade .7s ease-out .1s forwards, pShimmer 6s linear infinite;
    }
    @keyframes pShimmer { to { background-position:-200% center; } }
    @media (prefers-reduced-motion:reduce){
      body::before{animation:none}
      .wrap > *{opacity:1;transform:none;animation:none}
      .wrap h1{animation:none;color:#f5f5f5;-webkit-text-fill-color:#f5f5f5}
    }

  </style>
</head>
<body>
  <main class="wrap">
    <h1>Partner</h1>
    <p>Something new is in the works.</p>
    <p>Check back soon.</p>
    <p class="home-link"><a href="https://courtrightco.com">← courtrightco.com</a></p>
  </main>
</body>
</html>
